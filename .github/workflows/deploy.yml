name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once — a slower older sync could overwrite a newer one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # GitHub OIDC → AWS IAM role (no long-lived access keys)

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - run: yarn install --frozen-lockfile

      # Same file that's used for local production builds; stored whole as one multi-line secret.
      - name: Write .env.production
        env:
          ENV_PRODUCTION: ${{ secrets.ENV_PRODUCTION }}
        run: |
          if [ -z "$ENV_PRODUCTION" ]; then
            echo "::error::ENV_PRODUCTION secret is not set"
            exit 1
          fi
          printf '%s\n' "$ENV_PRODUCTION" > .env.production

      - run: yarn build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Hashed assets are immutable; upload them first so new HTML never references a missing chunk.
      - name: Upload static assets
        run: |
          aws s3 sync out/_next "s3://${{ vars.S3_BUCKET }}/_next" \
            --cache-control "public, max-age=31536000, immutable"

      # Everything else (HTML, RSC payloads, public/ files) must revalidate on each visit.
      # --delete runs here, after the new assets exist, and skips _next so old chunks
      # stay available to tabs still running the previous build.
      - name: Upload pages
        run: |
          aws s3 sync out "s3://${{ vars.S3_BUCKET }}" \
            --exclude "_next/*" \
            --cache-control "public, max-age=0, must-revalidate" \
            --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
