name: CI

on:
  pull_request:
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: yarn lint

      # Builds with the committed defaults only (no .env) — catches export/prerender breakage
      # without needing production config on PRs from forks.
      - name: Build
        run: yarn build
        env:
          # AppKit throws at prerender without a project ID; any non-empty value works for a build check.
          NEXT_PUBLIC_APP_KIT_PROJECT_ID: ci-placeholder
